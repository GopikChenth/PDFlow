[package]
name = "ink-vault"
version = "0.1.0"
description = "Lightweight, Modern & Offline Document Suite"
authors = ["Ink Vault Team"]
edition = "2021"

[lib]
name = "ink_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
